name: gh
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  main:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Generate docs
        run: pnpm dlx nx run-many -t doc

      - run: pnpm dlx nx fix-ci
        if: always()
